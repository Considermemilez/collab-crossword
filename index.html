<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Collaborative Crossword</title>
    <link rel="stylesheet" href="styles.css" />
</head>
<body>

    <h1>Games by Gregg</h1>

    <div id="auth-screen">
        <div id="auth-panel">
            <h3>Account</h3>

            <p id="auth-status">Checking account...</p>

            <input 
                id="auth-email" 
                type="email" 
                placeholder="Email" 
                autocomplete="email" 
            />

            <input 
                id="auth-password" 
                type="password" 
                placeholder="Password" 
                autocomplete="current-password" 
            />

            <div id="auth-actions">
                <button id="auth-sign-up-btn">Sign Up</button>
                <button id="auth-sign-in-btn">Sign In</button>
                <button id="auth-sign-out-btn" class="hidden">Sign Out</button>
            </div>

            <div id="profile-panel" class="hidden">
                <label for="profile-display-name">Display name:</label>
                <input 
                    id="profile-display-name" 
                    type="text" 
                    placeholder="Gregg" 
                />

                <button id="profile-save-btn">
                    Save Display Name
                </button>
            </div>
        </div>
    </div>

    <div id="game-select-screen" class="hidden">
        <h2>Choose a Game</h2>

        <button id="select-crossword-btn">
            Crossword
        </button>

        <button id="game-select-account-btn" class="secondary-button">
            Account/ Sign out
        </button>
    </div>

    <div id="welcome-screen" class="hidden">
        <h2>Crossword Lobbies</h2>

        <button id="crossword-lobby-account-btn" class="secondary-button">
            Account / Sign Out
        </button>

        <button id="back-to-games-btn" class="secondary-button">
            Back to Game Selection
        </button>

        <div id="create-room-panel">
                <h3>Create Crossword Room</h3>

                <label for="room-name-input">Room name:</label>
                <input 
                    id="room-name-input" 
                    type="text" 
                    placeholder="Gregg's Room" 
                />

                <label for="room-visibility-select">Visibility:</label>
                <select id="room-visibility-select">
                    <option value="public">Public</option>
                    <option value="private">Private</option>
                </select>

                <button id="create-room-btn">
                    Create Room
                </button>

                <p id="create-room-status"></p>
            </div>

            <div id="room-list-panel">
                <h3>Available Crossword Rooms</h3>

                <button id="refresh-rooms-btn">
                    Refresh Rooms
                </button>

                <div id="room-list">
                    No rooms loaded yet.
                </div>
            </div>


        <details id="local-test-panel">
            <summary>Developer: Local Test Game</summary>
        

            <div id="resume-game-panel" class="hidden">
                <p>You have an unfinished puzzle.</p>

                <button id="resume-game-btn">
                    Resume
                </button>

                <button id="discard-saved-game-btn">
                    Start New Game
                </button>
            </div>

            <label for="player-one-name">Your first name:</label>
            <input id="player-one-name" type="text" placeholder="Gregg" />

            <div>
                <label>
                    <input type="radio" name="play-mode" value="solo" checked />
                    Solo
                </label>

                <label>
                    <input type="radio" name="play-mode" value="pair" />
                    Pair
                </label>
            </div>

            <label for="puzzle-select">Puzzle:</label>

            <select id="puzzle-select"></select>

            <div id="player-two-section" class="hidden">
                <label for="player-two-name">Partners first name:</label>
                <input id="player-two-name" type="text" placeholder="Omi" />
            </div>

            <button id="start-game-btn" disabled>
                Sign in to Start Game
            </button>
        </details>
    </div>

    <div id="room-lobby-screen" class="hidden">
        <h2 id="room-lobby-title">Room Lobby</h2>

        <button id="room-lobby-back-btn" class="secondary-button">
            Back to Crossword Lobbies
        </button>

        <div id="room-lobby-details"></div>

        <h3>Players</h3>
        <div id="room-lobby-players"></div>

        <button id="room-lobby-start-btn" disabled>
            Start Game
        </button>

        <p id="room-lobby-status"></p>
    </div>

    <div id="game-screen" class="hidden">

    
        <div id="game-controls">
            <div id="timer">00:00</div>

            <button id="check-btn">Check Answers</button>

            <div id="reveal-menu-wrapper">
                <button id="reveal-btn">Reveal</button>

                <div id="reveal-menu" class="hidden">
                    <button id="reveal-letter-btn">Letter</button>
                    <button id="reveal-word-btn">Word</button>
                    <button id="reveal-puzzle-btn">Puzzle</button>
                </div>
            </div>
        </div>
        

        <div id="grid"></div>

        <div id="clues">
            <div id="across-clues">
                <h3>Across</h3>
                <div id="across-list"></div>
            </div>

            <div id="down-clues">
                <h3>Down</h3>
                <div id="down-list"></div>
            </div>

        </div>
    </div>

    <div id="completion-modal" class="modal hidden">
        <div class="modal-content">
            <h2>🎉 Puzzle Complete!</h2>

            <p>
                <strong>Time:</strong>
                <span id="completion-time"></span>
            </p>

            <p id="completion-eligibility"></p>

            <h3>Best Times</h3>

            <div id="completion-leaderboard"></div>

            <button id="completion-new-game-btn">
                Choose Another Puzzle
            </button>

            <button id="completion-close-btn">
                Close
            </button>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script type="module" src="main.js"></script>

</body>
</html>
